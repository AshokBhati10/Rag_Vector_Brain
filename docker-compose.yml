version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vectorbrain_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: vectorbrain
      POSTGRES_PASSWORD: vectorbrain
      POSTGRES_DB: vectorbrain
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: vectorbrain_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    depends_on:
      - db

volumes:
  pgdata:
