version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: vectorbrain_db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: vectorbrain
      POSTGRES_PASSWORD: vectorbrain
      POSTGRES_DB: vectorbrain
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: vectorbrain_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    depends_on:
      - db
      - rabbitmq

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: vectorbrain_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build: ./backend
    container_name: vectorbrain_worker
    command: celery -A app.celery_app.celery_app worker -Q parse,embed --concurrency=2 --loglevel=info
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=amqp://guest:guest@rabbitmq:5672//
    depends_on:
      db:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: vectorbrain_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
  rabbitmq_data:
